<!doctype html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="pico.min.css">
    <style>
        div.bordered {
            border: 1px solid;
            border-radius: 5px;
            padding: .5rem;
            margin-bottom: 20px;
        }

        div.error {
            border-color: firebrick;
        }

        div.msg {
            border-color: darkgreen;
        }
    </style>
    <title>GNAT Configuration</title>
</head>

<body>
    <main class="container">
        <div style="text-align:right;"><img src="gnat_white.png" style="padding-bottom:1rem" /></div>
        <div class="bordered error" id="error" style="display:none;"></div>
        <div class="bordered msg" id="msg" style="display:none;"></div>
        <form method="post" action="/config">
            <label for="stop_weight">Stop at Weight</label>
            <input type="number" name="stop_weight" id="stop_weight" placeholder="36" min="0" max="100" required>
            <small>Automatically stop shot at this weight in grams.</small>

            <label for="sleep_time">Sleep Timeout</label>
            <input type="number" name="sleep_time" id="sleep_time" placeholder="15" min="0" max="360" required>
            <small>How many minutes before your machine is put to sleep.</small>

            <label for="refill_level">Refill Level</label>
            <input type="number" name="refill_level" id="refill_level" placeholder="3" min="1" max="20" required>
            <small>Water level in millimeters at which your machine asks for a refill.</small>

            <label>Profiles</label>
            <div id="profiles" style="max-height:20rem;overflow-y:auto;" class="bordered"></div>
            <small>Profiles the button on your gnat cycles through.</small>
            <input type="hidden" name="enabled" id="enabled">

            <button type="submit">Save</button>
        </form>
    </main>
</body>

<script>
    const queryString = window.location.search;
    const urlParams = new URLSearchParams(queryString);

    const stopWeight = urlParams.get('stop_weight');
    document.getElementById("stop_weight").value = stopWeight;

    const sleepTime = urlParams.get("sleep_time");
    document.getElementById("sleep_time").value = sleepTime;

    const refillLevel = urlParams.get("refill_level");
    document.getElementById("refill_level").value = refillLevel;

    // fetch our profile names and render them as checkboxes, checked state
    // comes from the enabled hex bitmask, byte i bit j = profile i * 8 + j
    const enabledHex = urlParams.get("enabled") || "";
    const enabledBit = (idx) => {
        const byte = parseInt(enabledHex.substr((idx >> 3) * 2, 2), 16);
        return !isNaN(byte) && (byte >> (idx % 8) & 1) == 1;
    };

    let profileCount = 0;
    fetch("/profiles.json").then(r => r.json()).then(names => {
        profileCount = names.length;
        const container = document.getElementById("profiles");
        names.forEach((name, idx) => {
            const label = document.createElement("label");
            const box = document.createElement("input");
            box.type = "checkbox";
            box.dataset.idx = idx;
            box.checked = enabledHex ? enabledBit(idx) : false;
            label.appendChild(box);
            label.appendChild(document.createTextNode(name));
            container.appendChild(label);
        });
    });

    // pack the checkboxes back into the hex bitmask on submit
    document.querySelector("form").addEventListener("submit", () => {
        if (profileCount == 0) {
            return;
        }
        const bytes = new Array(Math.ceil(profileCount / 8)).fill(0);
        document.querySelectorAll("#profiles input:checked").forEach(box => {
            const idx = parseInt(box.dataset.idx);
            bytes[idx >> 3] |= 1 << (idx % 8);
        });
        document.getElementById("enabled").value =
            bytes.map(b => b.toString(16).padStart(2, "0")).join("");
    });

    const error = urlParams.get("error");
    if (error) {
        ediv = document.getElementById("error");
        ediv.innerText = error;
        ediv.style.display = "block";
    }

    const msg = urlParams.get("msg");
    if (msg) {
        mdiv = document.getElementById("msg");
        mdiv.innerText = msg;
        mdiv.style.display = "block";
    }
</script>

</html>
